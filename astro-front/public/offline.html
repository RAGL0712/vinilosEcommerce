<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión | VINILO</title>
    <link rel="icon" href="/logo.webp" />
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: Montserrat, Arial, sans-serif; background: #ffffff; color: #000000; text-align: center; padding: 16px; }
      main { max-width: 420px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.6em; margin: 16px 0 8px; }
      p { line-height: 1.5; color: #333333; }
      .acciones { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
      a, button { font: inherit; padding: 10px 18px; border-radius: 6px; border: 2px solid #000000; cursor: pointer; text-decoration: none; }
      button { background: #000000; color: #ffffff; }
      a { background: #ffffff; color: #000000; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.webp" alt="Logo de VINILO" width="72" height="72" />
      <h1>Estás sin conexión</h1>
      <p>Esta página todavía no está guardada en tu dispositivo. Puedes ver el catálogo y los discos que ya visitaste; el resto estará disponible cuando vuelva el internet.</p>
      <div class="acciones">
        <button type="button" onclick="location.reload()">Reintentar</button>
        <a href="/">Ir al inicio</a>
      </div>
    </main>
    <script>
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
