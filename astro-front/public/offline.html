<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión | VINILO</title>
    <link rel="icon" href="/logo.webp" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
             font-family: Montserrat, Arial, sans-serif; background: #ffffff; color: #000000; text-align: center;
             padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      main { width: 100%; max-width: 420px; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.6em; margin: 16px 0 8px; }
      p { line-height: 1.5; color: #333333; }
      .acciones { display: flex; gap: 12px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
      a, button { font: inherit; padding: 10px 18px; border-radius: 6px; border: 2px solid #000000; cursor: pointer; text-decoration: none; }
      button { background: #000000; color: #ffffff; }
      a { background: #ffffff; color: #000000; }
      @media (orientation: landscape) and (max-height: 500px) { img { width: 48px; height: 48px; } h1 { margin-top: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.webp" alt="Logo de VINILO" width="72" height="72" />
      <h1 id="titulo">Estás sin conexión a internet</h1>
      <p id="texto">Esta página todavía no está guardada en tu dispositivo. Puedes ver el catálogo y los discos que ya visitaste; el resto estará disponible cuando vuelva el internet.</p>
      <div class="acciones">
        <button type="button" id="reintentar" onclick="location.reload()">Reintentar</button>
        <a id="inicio" href="/">Ir al inicio</a>
      </div>
    </main>
    <script>
      // Esta misma pagina sirve para toda la tienda: el idioma sale de la ruta que se pidio (/en/... = ingles)
      if (location.pathname.indexOf('/en') === 0) {
        document.documentElement.lang = 'en'
        document.title = 'Offline | VINILO'
        document.getElementById('titulo').textContent = "You're offline"
        document.getElementById('texto').textContent = "This page isn't saved on your device yet. You can browse the catalog and the records you've already visited; the rest will be available when the internet is back."
        document.getElementById('reintentar').textContent = 'Try again'
        document.getElementById('inicio').textContent = 'Go home'
        document.getElementById('inicio').href = '/en/'
      }
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
