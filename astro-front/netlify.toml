[build]
  command = "npm run build"
  publish = "dist"

# JS de Astro: el nombre lleva un hash, nunca cambia -> 1 año
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagenes de la raiz (hero, logo) -> 30 dias
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Iconos de la PWA -> 30 dias
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Service Worker y manifiestos: siempre revisar si hay version nueva
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"